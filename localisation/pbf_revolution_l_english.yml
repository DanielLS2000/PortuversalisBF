# Coalitions
 pbf_revolution.1.t: "The First Coalition"
 pbf_revolution.1.d: "Fearing the growing power and unchecked ambitions of a rising force, the surrounding nations have set aside their differences to form a grand coalition. Determined to curb its influence and restore balance, these nations now prepare for war. Whether this alliance will stand the test of time or crumble under the weight of conflicting interests remains to be seen."
 pbf_revolution.1.A: "Let them come"
